const rules=`<h1>🖤 𝕮𝖍𝖆𝖔𝖘 𝕲𝖗𝖊𝖒𝖑𝖎𝖓𝖘 — 𝕮𝖔𝖒𝖒𝖚𝖓𝖎𝖙𝖞 𝕽𝖚𝖑𝖊𝖘 💜</h1>

<p>Welcome to the Chaos Gremlins! This is our space to connect, make friends, chat, and be ourselves. To keep our community enjoyable for everyone, all members are expected to follow these rules.</p>

<div class="rule"><h3>2. No Drama or Toxic Behavior</h3><p>We're here for fun, not unnecessary drama. Don't start fights, spread rumors, provoke arguments, or bring personal feuds into the community.</p></div>
<div class="rule"><h3>3. Be Yourself</h3><p>Let your personality shine! Weird, wild, goofy, and unhinged are welcome. Just make sure your freedom to express yourself doesn't come at someone else's expense.</p></div>
